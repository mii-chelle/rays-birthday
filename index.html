<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171522"><meta name="description" content="A little adventure with a very rare birthday surprise. Walk, jump, and discover a magical pack of pixel cards."><title>Ray’s birthday adventure</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><section class="game-shell" aria-label="Birthday adventure"><div class="game-toolbar"><div><span class="live-dot"></span><span id="chapter">RAY’S BIRTHDAY ADVENTURE</span></div><button id="sound" class="small-button" aria-label="Mute music and sound effects" aria-pressed="true">SOUND ON</button></div>
